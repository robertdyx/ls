name: Deploy Vite (fr) to GitHub Pages

on:
  push:
    branches: [ fr ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  # 你的前端目录（按实际情况已设置好）
  APP_DIR: capstone-project-25t3-9900-h18e-cake-demo2-import/frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      # 用仓库 Secrets 注入 Vite 的 .env.production（只在构建机存在）
      - name: Inject env for Vite
        run: |
          mkdir -p "${APP_DIR}"
          cat > "${APP_DIR}/.env.production" << 'EOF'
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_BUCKET=${{ secrets.VITE_SUPABASE_BUCKET }}
          EOF

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Build
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      # SPA 刷新 404 兼容
      - name: SPA fallback (copy 404.html)
        run: cp "${APP_DIR}/dist/index.html" "${APP_DIR}/dist/404.html"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.APP_DIR }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
