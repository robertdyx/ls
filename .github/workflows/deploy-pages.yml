name: Deploy Vite (fr) to GitHub Pages

on:
  push:
    branches: [ fr ]   # ★ 监听 fr 分支

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 将 Secrets 注入为 .env.production（Vite 会自动读取）
      - name: Inject env for Vite
        run: |
          cat > .env.production << 'EOF'
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_BUCKET=${{ secrets.VITE_SUPABASE_BUCKET }}
          EOF

      - run: npm ci
      - run: npm run build

      # 单页应用路由兼容：复制 index.html 为 404.html（避免刷新 404）
      - name: SPA fallback (404)
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
