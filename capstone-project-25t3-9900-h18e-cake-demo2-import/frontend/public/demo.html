<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo</title>
  <style>
    html, body { height: 100%; margin: 0; }
    .full { position: fixed; inset: 0; border: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <iframe id="app" class="full" title="Demo" loading="lazy"
          allowfullscreen
          sandbox="allow-scripts allow-same-origin allow-popups allow-forms">
  </iframe>

  <script>
    // 把当前 demo.html 上的所有查询参数（尤其是 ?api=... ）原封不动透传给应用
    const qs = window.location.search; // 例如 ?api=https%3A%2F%2Fxxxx.ngrok-free.dev
    // 你的 Vite 构建产物入口路径通常就是 ./ 或者 ./index.html
    document.getElementById('app-frame').src = './' + (qs || '');
  </script>
</body>
</html>
